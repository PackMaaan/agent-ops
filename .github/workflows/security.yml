name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a CVE disclosed after the last commit still surfaces.
    - cron: "27 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (actions)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: actions

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:actions"

  zizmor:
    name: workflow static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Catches the failure modes actionlint does not: template injection,
      # excessive permissions, unpinned actions, artifact poisoning.
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: ${{ github.event.repository.visibility == 'public' }}

  gitleaks:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The gitleaks *action* scans an incremental range derived from the push
      # event, which is `<sha>^..<sha>` — unresolvable when the range includes a
      # root commit, so it fails on a repository's first push. Running the
      # pinned image directly scans the full history instead: no edge case, no
      # licence phone-home, and the version is visible in the diff.
      - name: gitleaks (full history)
        uses: docker://zricethezav/gitleaks:v8.29.1
        with:
          args: detect --source=/github/workspace --redact --no-banner --verbose --exit-code=1

  permissions-audit:
    name: submodule integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Submodule URLs must be HTTPS on a known host
        run: |
          # A submodule URL is arbitrary code execution on every consumer's
          # machine. git:// and ssh:// URLs, and unexpected hosts, are rejected.
          status=0
          while read -r _ url; do
            case "$url" in
              https://github.com/*) printf '  ok   %s\n' "$url" ;;
              *) printf '  FAIL %s — only https://github.com/ URLs are allowed\n' "$url"; status=1 ;;
            esac
          done < <(git config -f .gitmodules --get-regexp '^submodule\..*\.url$')
          exit "$status"

      - name: Submodules must not contain nested workflows that we execute
        run: |
          # Informational: upstream workflow files are never run by this repo,
          # but a reviewer should know when new ones appear.
          find modules -path '*/.github/workflows/*' -name '*.yml' 2>/dev/null | sort || true
