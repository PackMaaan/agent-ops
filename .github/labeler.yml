documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/*.yml"

agent-ops:
  - changed-files:
      - any-glob-to-any-file:
          - "bin/**"
          - "scripts/**"
          - "skills/**"
          - "templates/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - ".gitmodules"
          - "modules/**"
          - "registry/modules.json"
          - "renovate.json"

security:
  - changed-files:
      - any-glob-to-any-file:
          - "SECURITY.md"
          - ".github/workflows/security.yml"
          - ".github/workflows/scorecard.yml"
