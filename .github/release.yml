changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
    authors:
      - dependabot
      - dependabot[bot]
      - renovate
      - renovate[bot]
  categories:
    - title: ⚠️ Breaking changes
      labels:
        - breaking-change
    - title: 🚀 Features
      labels:
        - enhancement
        - feature
    - title: 🧩 Modules
      labels:
        - modules
    - title: 🐛 Bug fixes
      labels:
        - bug
    - title: 🔒 Security
      labels:
        - security
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🧹 Maintenance
      labels:
        - chore
        - refactor
        - ci
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
