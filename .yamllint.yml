extends: default

ignore: |
  modules/
  node_modules/

rules:
  # GitHub Actions uses `on:` which yamllint's default truthy rule flags.
  truthy:
    allowed-values: ["true", "false"]
    check-keys: false

  line-length:
    max: 120
    level: warning
    allow-non-breakable-words: true

  comments:
    min-spaces-from-content: 1

  document-start: disable

  # Issue forms and workflow files both use long nested option lists.
  indentation:
    spaces: 2
    indent-sequences: consistent
