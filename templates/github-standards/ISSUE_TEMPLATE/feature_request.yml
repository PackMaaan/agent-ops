name: Feature request
description: Propose a capability that does not exist yet.
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Good feature requests describe a **problem** first and a solution
        second. If you already know the implementation you want, say so — but
        lead with the constraint that makes it necessary.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you unable to do today, and what does that cost you?
      placeholder: |
        When I run X across more than 50 repositories, I have to ... because ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change? Sketch the interface if you have one in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: |
        What did you try instead, and why was it insufficient? "Nothing yet" is
        a valid answer.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Your best guess — maintainers will adjust during triage.
      options:
        - Small — a flag, a message, a doc fix
        - Medium — a new command or workflow
        - Large — an architectural change
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.
          required: false
